name: Update TW Institutional Data
on:
  schedule:
    # ⭐ 2026-05-05 修改：原 "10 0 * * *"（早上 08:10 GMT+8）跑時 TWSE 還沒收盤
    # 改成 UTC 10:00 = 台北 18:00（傍晚），等 TWSE 17:00 公布完整 T86 後再抓
    # 1-5 = 只在週一到週五跑（週末沒交易日）
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      - name: Run update_all.py
        run: |
          python update_all.py
      - name: Run update_broker.py
        run: |
          python update_broker.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: update latest data only"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
